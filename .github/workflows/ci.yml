name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project (locked)
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov=skill_lens --cov-report=term-missing

  packaging:
    name: packaging (build + install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Verify package archives (wheel and sdist)
        run: |
          wheel=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          uv run python scripts/smoke_wheel.py --verify-archive-only --wheel "$wheel" --sdist "$sdist"

      - name: Verify console script installs and runs (base lane)
        run: |
          wheel=$(ls dist/*.whl)
          uv run python scripts/smoke_wheel.py --verify-base-only --wheel "$wheel"

      - name: Verify minimum endpoint (textual==8.2.8) installed lifecycle and parity
        run: |
          wheel=$(ls dist/*.whl)
          uv run python scripts/smoke_wheel.py --verify-min-only --wheel "$wheel"

      - name: Verify latest endpoint (unconstrained) installed lifecycle and parity
        run: |
          wheel=$(ls dist/*.whl)
          uv run python scripts/smoke_wheel.py --verify-latest-only --wheel "$wheel"
