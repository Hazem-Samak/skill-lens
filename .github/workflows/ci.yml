name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project (locked)
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  packaging:
    name: packaging (build + install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: The wheel must carry the agent registry
        run: |
          wheel=$(ls dist/*.whl)
          count=$(unzip -l "$wheel" | grep -c 'registry/agents/.*\.toml')
          echo "registry TOMLs in wheel: $count"
          test "$count" -eq 10

      - name: Verify console script installs and runs
        run: |
          uv venv /tmp/smoke --python 3.13
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/skill-lens --version
          /tmp/smoke/bin/skill-lens --help
