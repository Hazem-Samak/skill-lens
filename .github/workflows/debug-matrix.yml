name: debug matrix

on:
  push:
    branches: [fix/overnight-closure-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked project
        run: |
          timeout 300 uv sync --locked --extra dev
          echo "SYNC_EXIT=$?"
      - name: Collect
        run: |
          timeout 120 uv run pytest --collect-only -q --no-header -p no:cacheprovider
          echo "COLLECT_EXIT=$?"
      - name: Run suite verbosely
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout -s INT 300 uv run pytest -v -ra --no-header -p no:cacheprovider
          echo "TEST_EXIT=$?"
