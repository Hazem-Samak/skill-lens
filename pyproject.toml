[project]
name = "skill-lens-cli"
version = "0.1.0"
description = "A local, read-only diagnostics and resolution engine for AI agent skills (SKILL.md)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hazem Samak" }]
keywords = [
    "ai",
    "agents",
    "skills",
    "skill.md",
    "cli",
    "diagnostics",
    "claude-code",
    "codex",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/Hazem-Samak/skill-lens"
Repository = "https://github.com/Hazem-Samak/skill-lens"
Issues = "https://github.com/Hazem-Samak/skill-lens/issues"

[project.scripts]
skill-lens = "skill_lens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_lens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["skill_lens"]

[tool.coverage.run]
source = ["skill_lens"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
