[project]
name = "skill-lens"
version = "0.1.0"
description = "A local diagnostics and resolution CLI tool for AI agent capabilities"
readme = "SKILL_LENS_SPECIFICATION.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
skill-lens = "skill_lens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
