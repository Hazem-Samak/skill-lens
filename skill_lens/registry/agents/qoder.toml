# Format evidence (2026-10-13):
# Primary source: https://docs.qoder.com/cli/Skills
# Sections "Where Skills live" and "Organize Directory Structure" document
# ~/.qoder/skills/{skill-name}/SKILL.md (user) and .qoder/skills/{skill-name}/SKILL.md (project).
# Docs explicitly state: "User skills (~/.qoder/skills) override project skills (.qoder/skills)".
# Native roots (qoder_global, qoder_project) have documented directory format;
# shared project root (qoder_project_agents) is an unverified/non-native compatibility root:
# entry_format = "standalone_md" preserves pre-C baseline discovery compatibility (directory bundles + flatfiles);
# unknown root flat acceptance is Skill Lens compatibility, NOT proven vendor support/loadability (Stage D carryover).

[[roots]]
id = "qoder_global"
kind = "global"
path = ".qoder/skills"
scope = "user"
entry_format = "directory"
rank = 95
rule_id = "qoder_global_symlink_farm"
evidence = "documented"

[[roots]]
id = "qoder_project"
kind = "project"
path = ".qoder/skills"
scope = "project"
entry_format = "directory"
rank = 70
rule_id = "qoder_project_shadow"
evidence = "documented"

[[roots]]
id = "qoder_project_agents"
kind = "project"
path = ".agents/skills"
scope = "project"
