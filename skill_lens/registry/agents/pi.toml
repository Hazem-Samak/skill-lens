id = "pi"
name = "Pi Agent"
identity_source = "frontmatter_name"
collision_policy = "Shadow (User > Project)"
policy_evidence = "documented"
coexist_policy = "shadow"
walk_boundary = "git_root"
unsearched_rule_id = "pi_search_roots"
source = "https://github.com/earendil-works/pi/blob/main/packages/coding-agent/src/core/skills.ts"

# Upstream skills.ts lines 463-466: loadSkills loads user defaults before project defaults.
# addSkills records collisionDiagnostics with winnerPath=existing.filePath (the user skill)
# and loserPath=skill.filePath (the project skill), keeping existing in skillMap.
# Precedence is therefore User > Project.
# Upstream loadSkillsFromDirInternal loads direct .md children at root, recurses into subdirectories,
# and treats any directory containing SKILL.md as a skill root without recursing deeper into it.

[[roots]]
id = "pi_global_agent"
kind = "global"
path = ".pi/agent/skills"
entry_format = "qualified_standalone_md"
scope = "user"
rank = 95
rule_id = "pi_global_symlink_farm"
evidence = "documented"
recursive = true

