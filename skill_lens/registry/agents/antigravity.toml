id = "antigravity"
name = "Antigravity CLI"
identity_source = "hybrid"
collision_policy = "Shadow (Project > User > Builtin)"
policy_evidence = "empirical"
coexist_policy = "shadow"
walk_boundary = "git_root"
unsearched_rule_id = "antigravity_search_roots"
source = "https://antigravity.google/docs/skills"

# Precedence is Project > User > Builtin (see collision_policy), so every
# project root outranks every global root. Higher rank == wins.
#
# Global user skills may be a directory or a standalone ``.md`` file.
# Documented CLI global root: ~/.gemini/antigravity-cli/skills.
[[roots]]
id = "antigravity_cli_global"
kind = "global"
path = ".gemini/antigravity-cli/skills"
scope = "user"
rank = 75
rule_id = "antigravity_cli_skills"
file_rule_id = "antigravity_standalone_md"
evidence = "documented"
entry_format = "standalone_md"

[[roots]]
id = "antigravity_global"
kind = "global"
path = ".gemini/config/skills"
scope = "user"
rank = 70
rule_id = "antigravity_global_skills"
file_rule_id = "antigravity_standalone_md"
evidence = "empirical"
entry_format = "standalone_md"
loadability = "unknown"

[[roots]]
id = "antigravity_builtin"
kind = "global"
path = ".gemini/antigravity/builtin/skills"
scope = "system"
rank = 30
rule_id = "antigravity_builtin"
evidence = "documented"
entry_format = "standalone_md"

[[roots]]
id = "antigravity_project_agents"
kind = "project"
path = ".agents/skills"
scope = "project"
rank = 90
rule_id = "antigravity_project_shadow"
evidence = "empirical"
loadability = "unknown"

[[roots]]
id = "antigravity_project_agent"
kind = "project"
path = ".agent/skills"
scope = "project"
rank = 85
rule_id = "antigravity_project_shadow"
evidence = "documented"
